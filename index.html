<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자연별곡 매장별 VOC 대시보드</title>
<style>
  :root{
    --brand-light:#FBF6EA; --brand:#F1E6CB; --brand-mid:#E3D2A0; --brand-dark:#8A6D3B; --brand-darker:#6E5527;
    --bar-fill:#ECD9AE; --bar-border:#C9A063;
    --navy:#1E2761;
    --q:#C40000; --s:#C3D69B; --c:#93CDDD; --a:#8A8A8A;
    --bg:#F9F7F1; --border:#E7DFC9; --text:#2B2B2B; --sub:#8A8478;
    --pill-gold-bg:#F7E7B4; --pill-gold-text:#8A6D2A;
    --pill-pink-bg:#FBE0E4; --pill-pink-text:#B23A4E;
  }
  *{box-sizing:border-box;}
  body{margin:0; padding:0; background:#FFFFFF; color:var(--text); font-family:'Noto Sans KR','맑은 고딕',sans-serif;}

  .topbar{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--brand-light); padding:14px 28px; border-bottom:1px solid var(--border); flex-wrap:wrap; gap:10px;
  }
  .topbar-left{display:flex; align-items:center; gap:10px;}
  .topbar-left .stripe{width:5px; height:32px; background:var(--brand-dark); border-radius:3px;}
  .topbar-left h1{margin:0; font-size:18px; font-weight:800; color:var(--brand-dark);}
  .topbar-left .icon{font-size:20px;}
  .topbar-left .sub{font-size:11.5px; color:var(--sub); margin-top:2px;}
  .topbar-right{display:flex; gap:8px; flex-wrap:wrap;}
  .pill{font-weight:700; font-size:13px; padding:7px 14px; border-radius:999px;}
  .pill small{font-weight:500; font-size:11px; opacity:.85;}
  .pill-gold{background:var(--pill-gold-bg); color:var(--pill-gold-text);}
  .pill-pink{background:var(--pill-pink-bg); color:var(--pill-pink-text);}

  .monthbar{display:flex; background:var(--brand-darker); flex-wrap:wrap;}
  .month-btn{
    flex:1; min-width:90px; background:transparent; border:none; border-right:1px solid rgba(255,255,255,.08);
    padding:10px 8px; cursor:pointer; text-align:center; color:#EBDFC3;
  }
  .month-btn .m-name{font-weight:600; font-size:14px;}
  .month-btn .m-sub{font-size:10.5px; opacity:.75; margin-top:2px;}
  .month-btn.active{background:var(--brand-dark); color:#fff;}
  .month-btn.active .m-name{font-weight:800;}

  .weeksubbar{display:flex; align-items:flex-end; gap:6px; background:var(--brand); padding:10px 20px; border-bottom:1px solid var(--border); flex-wrap:wrap;}
  .week-btn{
    background:transparent; border:none; padding:8px 14px 10px; cursor:pointer; text-align:center; color:var(--brand-darker);
    border-bottom:3px solid transparent;
  }
  .week-btn .wk-name{font-weight:700; font-size:13.5px;}
  .week-btn .wk-sub{font-size:10.5px; opacity:.75; margin-top:1px;}
  .week-btn.active{border-bottom:3px solid var(--brand-darker); color:var(--brand-darker);}
  .week-btn.active .wk-name{font-weight:800;}
  .cum-btn{
    background:#fff; border:1px dashed var(--bar-border); border-radius:8px; padding:7px 14px; cursor:pointer;
    text-align:center; color:var(--brand-dark); box-shadow:0 1px 3px rgba(0,0,0,.05);
  }
  .cum-btn .wk-name{font-weight:700; font-size:13px;}
  .cum-btn .wk-sub{font-size:10px; opacity:.7; margin-top:1px;}
  .cum-btn.active{background:var(--brand-dark); color:#fff; border-color:var(--brand-dark);}

  .panel{display:none; padding:24px 28px 44px; max-width:1120px; margin:0 auto;}
  .panel.active{display:block;}

  .chart-card{border:1px solid var(--border); border-radius:12px; padding:20px 24px 10px; margin-bottom:20px; box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .chart-head{display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:6px; margin-bottom:2px;}
  .chart-title{font-size:14.5px; font-weight:800; color:var(--brand-dark);}
  .chart-sub{font-size:12px; color:var(--sub); background:var(--bg); padding:4px 10px; border-radius:999px;}
  .chart-legend{display:flex; gap:18px; font-size:12px; color:var(--sub); margin:8px 0 4px;}
  .chart-legend .sq{display:inline-block; width:11px; height:11px; margin-right:5px; vertical-align:-1px;}
  .sq-line{border:2px solid var(--brand-dark); background:#fff;}
  .sq-bar{background:var(--bar-fill); border:1.5px solid var(--bar-border);}

  .store-select-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:20px;}
  .store-select{
    border:2px solid var(--border); border-radius:12px; padding:14px 16px; cursor:pointer; background:#fff;
    transition:border-color .15s;
  }
  .store-select:hover{border-color:var(--brand-mid);}
  .store-select.active{border-color:var(--brand-dark); background:var(--brand-light);}
  .store-select .nm{font-size:13px; font-weight:700; color:var(--text); display:flex; align-items:center; gap:6px;}
  .store-select .dot{width:8px; height:8px; border-radius:50%; background:var(--sub); display:inline-block;}
  .store-select.active .dot{background:var(--brand-dark);}
  .store-select .avg{font-size:22px; font-weight:800; color:var(--brand-dark); margin-top:4px;}
  .store-select .sub{font-size:11.5px; color:var(--sub); margin-top:3px;}

  .detail-card{border:1px solid var(--border); border-radius:12px; padding:20px 24px; margin-bottom:16px;}
  .detail-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:8px;}
  .detail-head .ttl{font-size:15px; font-weight:800; color:var(--text);}
  .detail-head .ttl b{color:var(--brand-dark);}
  .badge{display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:700; color:#fff;}
  .qsc-bar-wrap{margin-bottom:14px;}
  .qsc-bar{display:flex; height:22px; border-radius:6px; overflow:hidden; border:1px solid var(--border);}
  .qsc-seg{display:flex; align-items:center; justify-content:center; color:#fff; font-size:11px; font-weight:700;}
  .qsc-legend{display:flex; gap:14px; margin-top:6px; font-size:11px; color:var(--sub);}
  .qsc-legend span{display:inline-flex; align-items:center; gap:4px;}
  .dot2{width:9px; height:9px; border-radius:50%; display:inline-block;}
  .top-issue{background:var(--brand-light); border:1px solid var(--brand-mid); border-radius:8px; padding:10px 14px; margin-bottom:14px; font-size:13px;}
  .top-issue b{color:var(--brand-dark);}
  table.detail{width:100%; border-collapse:collapse; margin-bottom:16px; font-size:12.5px;}
  table.detail th, table.detail td{border-bottom:1px solid var(--border); padding:7px 8px; text-align:left;}
  table.detail th{color:var(--sub); font-weight:600;}
  .unknown{color:#C0392B;}
  .toggle-reviews{
    background:var(--brand-dark); border:none; color:#fff; border-radius:8px;
    padding:9px 16px; font-size:12.5px; cursor:pointer; font-weight:700;
  }

  .drawer-overlay{display:none; position:fixed; inset:0; background:rgba(20,15,5,.35); z-index:50;}
  .drawer-overlay.open{display:block;}
  .drawer{
    position:fixed; top:0; right:-420px; width:400px; max-width:88vw; height:100%; background:#fff;
    box-shadow:-4px 0 20px rgba(0,0,0,.15); z-index:51; transition:right .25s ease; overflow-y:auto;
  }
  .drawer.open{right:0;}
  .drawer-head{
    background:var(--brand-light); padding:18px 20px; border-bottom:1px solid var(--border);
    display:flex; justify-content:space-between; align-items:center; position:sticky; top:0;
  }
  .drawer-head .t{font-size:15px; font-weight:800; color:var(--brand-dark);}
  .drawer-head .badge2{background:var(--brand-mid); color:var(--brand-dark); font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:999px;}
  .drawer-close{border:none; background:none; font-size:20px; cursor:pointer; color:var(--sub); margin-left:10px;}
  .drawer-body{padding:16px 20px;}
  .review-item{border-bottom:1px solid var(--border); padding:14px 0;}
  .review-item .meta{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
  .review-item .rate-badge{background:var(--brand-mid); color:var(--brand-dark); font-weight:800; font-size:12px; padding:3px 9px; border-radius:6px;}
  .review-item .rdate{font-size:11.5px; color:var(--sub);}
  .review-item .content{font-size:12.5px; line-height:1.6; white-space:pre-line; color:var(--text);}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="stripe"></div>
    <div>
      <div style="display:flex;align-items:center;gap:8px;"><span class="icon">🌿</span><h1>자연별곡 매장별 VOC 대시보드</h1></div>
      <div class="sub" id="dateRangeSub"></div>

    <span class="pill pill-gold" id="pillAvg"></span>
    <span class="pill pill-pink" id="pillLow"></span>

</div>

<div class="monthbar" id="monthbar"></div>
<div class="weeksubbar" id="weeksubbar"></div>
<div id="panels"></div>

<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>

</div>

<script>

<script>
var CAT_NAME = {Q:'품질', S:'서비스', C:'청결', A:'기타'};
var CAT_COLOR = {Q:'var(--q)', S:'var(--s)', C:'var(--c)', A:'var(--a)'};
var CAT_TEXT = {Q:'#fff', S:'#3A4A1E', C:'#1A4A5A', A:'#fff'};
var state = { month:null, panel:null };
var PANEL_STORES = {}; // panelKey -> stores map (raw or merged)
var PANEL_META = {};   // panelKey -> {label}

function niceCeil(v, step){ return Math.ceil(v/step)*step; }
function niceFloor(v, step){ return Math.floor(v/step)*step; }
function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function mergeStoreWeeks(weekKeys){
  var merged = {};
  weekKeys.forEach(function(wk){
    var stores = DASH.WEEKS[wk].stores;
    Object.keys(stores).forEach(function(nm){
      var d = stores[nm];
      if(!merged[nm]) merged[nm] = {total:0,lowSum:0,ratingSum:0,qsc:{},detailMap:{},low_reviews:[],short:d.short};
      var m = merged[nm];
      m.total += d.total; m.lowSum += d.low; m.ratingSum += (d.rsum!==undefined ? d.rsum : d.avg*d.total);
      Object.keys(d.qsc).forEach(function(k){ m.qsc[k]=(m.qsc[k]||0)+d.qsc[k]; });
      d.detail.forEach(function(item){
        var key = item.desc;
        if(!m.detailMap[key]) m.detailMap[key] = {cnt:0, cat:item.cat};
        m.detailMap[key].cnt += item.cnt;
      });
      m.low_reviews = m.low_reviews.concat(d.low_reviews);
    });
  });
  var result = {};
  Object.keys(merged).forEach(function(nm){
    var m = merged[nm];
    var detail = Object.keys(m.detailMap).map(function(desc){return {desc:desc,cnt:m.detailMap[desc].cnt,cat:m.detailMap[desc].cat};})
      .sort(function(a,b){return b.cnt-a.cnt;});
    result[nm] = {
      total:m.total, avg:Math.round((m.ratingSum/m.total)*100)/100,
      low:m.lowSum, low_pct:Math.round((m.lowSum/m.total*1000))/10,
      qsc:m.qsc, detail:detail, low_reviews:m.low_reviews, short:m.short
    };
  });
  return result;
}

function buildSummaryChart(names, stores){
  var W=900, H=300, padL=60, padR=60, padT=40, padB=36, dataInset=48;
  var n = names.length;
  var innerH = H-padT-padB;
  var avgs = names.map(function(nm){return stores[nm].avg;});
  var pcts = names.map(function(nm){return stores[nm].low_pct;});
  var minAvg = Math.min.apply(null, avgs), maxAvg = Math.max.apply(null, avgs);
  var minA = niceFloor(minAvg-0.05, 0.05), maxA = niceCeil(maxAvg+0.05, 0.05);
  var maxPctVal = Math.max.apply(null, pcts);
  var maxP = niceCeil(maxPctVal*1.7, 5); if(maxP<10) maxP=10;
  var minP = 0;
  var plotL = padL+dataInset, plotR = W-padR-dataInset;
  function xPos(i){ return n>1 ? plotL + ((plotR-plotL)/(n-1))*i : (plotL+plotR)/2; }
  function yLeft(v){ return padT + innerH - (v-minA)/(maxA-minA)*innerH; }
  function yRight(v){ return padT + innerH - (v-minP)/(maxP-minP)*innerH; }

  var steps=5, gridLines='', leftLabels='', rightLabels='';
  for(var g=0; g<=steps; g++){
    var yy = padT + innerH - (innerH/steps)*g;
    gridLines += '<line x1="'+padL+'" y1="'+yy.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+yy.toFixed(1)+'" stroke="#F1ECDD" stroke-width="1"/>';
    var av = minA + (maxA-minA)/steps*g;
    leftLabels += '<text x="'+(padL-14)+'" y="'+(yy+4).toFixed(1)+'" text-anchor="end" font-size="11" fill="#B3AA92">'+av.toFixed(2)+'</text>';
    var pv = minP + (maxP-minP)/steps*g;
    rightLabels += '<text x="'+(W-padR+14)+'" y="'+(yy+4).toFixed(1)+'" text-anchor="start" font-size="11" fill="#B3AA92">'+Math.round(pv)+'%</text>';
  }
  var barW = Math.min(52, (plotR-plotL)/n*0.42);
  var bars='', barLabels='';
  names.forEach(function(nm,i){
    var x = xPos(i), pct = stores[nm].low_pct;
    var yb = yRight(pct), yBase = yRight(0);
    bars += '<rect x="'+(x-barW/2).toFixed(1)+'" y="'+yb.toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+(yBase-yb).toFixed(1)+'" rx="4" fill="#ECD9AE" stroke="#C9A063" stroke-width="1.5"/>';
    barLabels += '<text x="'+x.toFixed(1)+'" y="'+(yb-10).toFixed(1)+'" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8A6D3B">'+pct+'%</text>';
  });
  var linePts = names.map(function(nm,i){ return xPos(i).toFixed(1)+','+yLeft(stores[nm].avg).toFixed(1); }).join(' ');
  var dots='', lineLabels='';
  names.forEach(function(nm,i){
    var x=xPos(i), y=yLeft(stores[nm].avg);
    dots += '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="5.5" fill="#fff" stroke="#8A6D3B" stroke-width="2.5"/>';
    lineLabels += '<text x="'+x.toFixed(1)+'" y="'+(y-16).toFixed(1)+'" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8A6D3B">'+stores[nm].avg.toFixed(2)+'</text>';
  });
  var xLabels='';
  names.forEach(function(nm,i){
    var x=xPos(i);
    xLabels += '<text x="'+x.toFixed(1)+'" y="'+(H-12)+'" text-anchor="middle" font-size="12.5" fill="#6B6455">'+stores[nm].short+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block;">'+
    gridLines+leftLabels+rightLabels+bars+barLabels+
    '<polyline points="'+linePts+'" fill="none" stroke="#8A6D3B" stroke-width="3"/>'+
    dots+lineLabels+xLabels+'</svg>';
}

function buildQscBar(qsc){
  var total=0; for(var k in qsc){ total+=qsc[k]; }
  if(total===0) return '<div style="font-size:12px;color:var(--sub);">문제 태깅된 리뷰 없음</div>';
  var order=['Q','S','C','A'];
  var html='<div class="qsc-bar">';
  order.forEach(function(k){ if(qsc[k]){ var w=(qsc[k]/total*100).toFixed(1); html+='<div class="qsc-seg" style="width:'+w+'%;background:'+CAT_COLOR[k]+';color:'+CAT_TEXT[k]+';">'+qsc[k]+'</div>'; } });
  html+='</div><div class="qsc-legend">';
  order.forEach(function(k){ html+='<span><span class="dot2" style="background:'+CAT_COLOR[k]+';"></span>'+CAT_NAME[k]+'('+k+') '+(qsc[k]||0)+'건</span>'; });
  html+='</div>';
  return html;
}

function buildDetailTable(detail){
  var rows='';
  detail.slice(0,5).forEach(function(d){
    var isUnknown = d.desc.indexOf('확인필요')>=0;
    var catBadge = d.cat ? '<span class="badge" style="background:'+CAT_COLOR[d.cat]+';color:'+CAT_TEXT[d.cat]+';font-size:10.5px;padding:2px 7px;margin-right:6px;">'+d.cat+'</span>' : '';
    rows+='<tr><td>'+catBadge+'<span class="'+(isUnknown?'unknown':'')+'">'+d.desc+'</span></td><td>'+d.cnt+'건</td></tr>';
  });
  return '<table class="detail"><thead><tr><th>세부 원인 (전체 TOP5)</th><th>건수</th></tr></thead><tbody>'+rows+'</tbody></table>';
}

function openDrawer(panelKey, storeKey){
  var d = PANEL_STORES[panelKey][storeKey];
  document.getElementById('drawerTitle').textContent = d.short;
  document.getElementById('drawerBadge').textContent = PANEL_META[panelKey].label + ' 저평점 리뷰 ' + d.low_reviews.length + '건';
  var body = d.low_reviews.map(function(r){
    return '<div class="review-item"><div class="meta"><span class="rate-badge">'+r.평점+'점</span><span class="rdate">'+(r.날짜||'')+'</span></div><div class="content">'+escapeHtml(r.내용)+'</div></div>';
  }).join('');
  document.getElementById('drawerBody').innerHTML = body || '<div style="color:var(--sub);font-size:13px;">저평점 리뷰가 없습니다.</div>';
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawerOverlay').classList.add('open');
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawerOverlay').classList.remove('open');
}

function renderDetail(panelKey, storeKey){
  var d = PANEL_STORES[panelKey][storeKey];
  var qscForRank = {}; ['Q','S','C'].forEach(function(k){ if(d.qsc[k]) qscForRank[k]=d.qsc[k]; });
  var topCat=null, topVal=-1;
  for(var k in qscForRank){ if(qscForRank[k]>topVal){ topVal=qscForRank[k]; topCat=k; } }
  var topDetail = d.detail && d.detail.length ? d.detail[0] : null;
  var html = '<div class="detail-card">'+
    '<div class="detail-head"><div class="ttl"><b>'+d.short+'</b> 상세 — 평균 '+d.avg+'점 · 1-2점 '+d.low_pct+'%('+d.low+'건) · 총 '+d.total+'건</div>'+
    (topCat?'<span class="badge" style="background:'+CAT_COLOR[topCat]+';color:'+CAT_TEXT[topCat]+';">'+CAT_NAME[topCat]+' 최우선</span>':'')+
    '</div>'+
    buildQscBar(d.qsc)+
    (topCat && topDetail ? '<div class="top-issue"><b>가장 뾰족한 원인:</b> ['+CAT_NAME[topDetail.cat]+'] '+topDetail.desc+' ('+topDetail.cnt+'건)</div>' : '')+
    buildDetailTable(d.detail)+
    '<button class="toggle-reviews" onclick="openDrawer(\''+panelKey+'\',\''+storeKey.replace(/'/g,"\\'")+'\')">1-2점 리뷰 원문 보기 ('+d.low_reviews.length+'건) →</button>'+
    '</div>';
  document.getElementById('detailArea-'+panelKey).innerHTML = html;
}

function selectStore(panelKey, storeKey){
  document.querySelectorAll('.store-select[data-panel="'+panelKey+'"]').forEach(function(el){
    el.classList.toggle('active', el.getAttribute('data-key')===storeKey);
  });
  renderDetail(panelKey, storeKey);
}

function renderPanel(panelKey){
  var stores = PANEL_STORES[panelKey];
  var label = PANEL_META[panelKey].label;
  var names = Object.keys(stores).sort(function(a,b){ return stores[a].avg - stores[b].avg; });

  var html = '<div class="chart-card">'+
    '<div class="chart-head"><div class="chart-title">['+label+'] 매장별 평균 평점 &amp; 1-2점 비율</div>'+
    '<div class="chart-sub">'+names.length+'개 매장 비교 · 아래에서 매장 선택 시 상세 변경</div></div>'+
    '<div class="chart-legend"><span><span class="sq sq-line"></span>평균 평점</span><span><span class="sq sq-bar"></span>1-2점 비율(%)</span></div>'+
    buildSummaryChart(names, stores)+
    '</div>';

  html += '<div class="store-select-row">';
  names.forEach(function(n, idx){
    var d = stores[n];
    var active = idx===0 ? ' active' : '';
    html += '<div class="store-select'+active+'" data-panel="'+panelKey+'" data-key="'+n.replace(/"/g,'&quot;')+'" onclick="selectStore(\''+panelKey+'\',\''+n.replace(/'/g,"\\'")+'\')">'+
      '<div class="nm"><span class="dot"></span>'+d.short+'</div>'+
      '<div class="avg">'+d.avg+'점</div>'+
      '<div class="sub">1-2점 '+d.low_pct+'% · 리뷰 '+d.total+'건</div>'+
      '</div>';
  });
  html += '</div><div id="detailArea-'+panelKey+'"></div>';

  var panelEl = document.createElement('div');
  panelEl.className = 'panel';
  panelEl.id = 'panel-'+panelKey;
  panelEl.innerHTML = html;
  document.getElementById('panels').appendChild(panelEl);

  renderDetail(panelKey, names[0]);
}

function showPanel(panelKey){
  document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('active');});
  var el = document.getElementById('panel-'+panelKey);
  if(!el){ renderPanel(panelKey); el = document.getElementById('panel-'+panelKey); }
  el.classList.add('active');
}

function buildWeekSubbar(monthObj){
  var bar = document.getElementById('weeksubbar');
  bar.innerHTML = '';
  monthObj.weekKeys.forEach(function(wk, i){
    var wkMeta = DASH.WEEKS[wk];
    PANEL_STORES[wk] = wkMeta.stores;
    PANEL_META[wk] = {label: wkMeta.label};
    var btn = document.createElement('button');
    btn.className = 'week-btn' + (i===0?' active':'');
    btn.innerHTML = '<div class="wk-name">'+wkMeta.label+'</div><div class="wk-sub">'+wkMeta.range+'</div>';
    btn.onclick = function(){
      document.querySelectorAll('#weeksubbar .week-btn, #weeksubbar .cum-btn').forEach(function(b){b.classList.remove('active');});
      btn.classList.add('active');
      state.panel = wk;
      showPanel(wk);
    };
    bar.appendChild(btn);
    if(i===0){ state.panel = wk; }
  });
  // 월 누적 탭
  var cumKey = 'cum_'+monthObj.key;
  PANEL_STORES[cumKey] = mergeStoreWeeks(monthObj.weekKeys);
  PANEL_META[cumKey] = {label: monthObj.label+' 누적'};
  var cumBtn = document.createElement('button');
  cumBtn.className = 'cum-btn';
  // 누적 기간: 첫 주차 시작일 ~ 마지막 주차 종료일 (예: 09-01~09-30)
  var firstRange = DASH.WEEKS[monthObj.weekKeys[0]].range.split('~')[0];
  var lastRange  = DASH.WEEKS[monthObj.weekKeys[monthObj.weekKeys.length-1]].range.split('~')[1];
  cumBtn.innerHTML = '<div class="wk-name">📊 '+monthObj.label+' 누적</div><div class="wk-sub">'+firstRange+'~'+lastRange+'</div>';
  cumBtn.onclick = function(){
    document.querySelectorAll('#weeksubbar .week-btn, #weeksubbar .cum-btn').forEach(function(b){b.classList.remove('active');});
    cumBtn.classList.add('active');
    state.panel = cumKey;
    showPanel(cumKey);
  };
  bar.appendChild(cumBtn);
}

function selectMonth(monthObj){
  state.month = monthObj.key;
  document.querySelectorAll('.month-btn').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-key')===monthObj.key); });
  buildWeekSubbar(monthObj);
  showPanel(state.panel);
}

function init(){
  var months = DASH.MONTHS;
  var monthbar = document.getElementById('monthbar');
  months.forEach(function(m, i){
    var tot=0, sum=0;
    m.weekKeys.forEach(function(wk){
      var stores = DASH.WEEKS[wk].stores;
      Object.keys(stores).forEach(function(nm){ tot+=stores[nm].total; sum+=(stores[nm].rsum!==undefined ? stores[nm].rsum : stores[nm].avg*stores[nm].total); });
    });
    var btn = document.createElement('button');
    btn.className = 'month-btn'+(i===0?' active':'');
    btn.setAttribute('data-key', m.key);
    btn.innerHTML = '<div class="m-name">'+m.label+'</div><div class="m-sub">총 '+tot+'건 · 평균 '+(sum/tot).toFixed(2)+'점</div>';
    btn.onclick = function(){ selectMonth(m); };
    monthbar.appendChild(btn);
  });

  // 전체 누적 (모든 월 합산) 상단 pill + 서브타이틀
  var allTotal=0, allLow=0, allSum=0;
  months.forEach(function(m){
    m.weekKeys.forEach(function(wk){
      var stores = DASH.WEEKS[wk].stores;
      Object.keys(stores).forEach(function(nm){
        var d = stores[nm];
        allTotal+=d.total; allLow+=d.low; allSum+=(d.rsum!==undefined ? d.rsum : d.avg*d.total);
      });
    });
  });
  document.getElementById('pillAvg').innerHTML = (allSum/allTotal).toFixed(2)+'점 <small>(누적)</small>';
  document.getElementById('pillLow').innerHTML = '1-2점 '+allLow+'건 · '+(allLow/allTotal*100).toFixed(1)+'% <small>(누적)</small>';
  var firstLabel = months[0].label, lastLabel = months[months.length-1].label;
  document.getElementById('dateRangeSub').textContent = '2026년 '+firstLabel+(firstLabel===lastLabel?'':'~'+lastLabel)+' 기준';

  selectMonth(months[0]);
}
init();
</script>

</html>
